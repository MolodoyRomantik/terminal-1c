name: Flutter Mini App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: flutter-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          cache: true
      - working-directory: mobile
        run: flutter pub get && flutter build web --release --base-href /terminal-1c/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web
      - uses: actions/deploy-pages@v4
